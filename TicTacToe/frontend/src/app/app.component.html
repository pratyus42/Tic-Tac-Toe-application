<main class="shell"><header><div><h1>Tic Tac <span>Toe</span></h1><p class="intro">A small game of nerve, timing, and three in a row.</p></div><div class="mode"><label for="mode">PLAY MODE</label><select id="mode" #mode (change)="chooseMode(mode.value === 'Computer' ? 'Computer' : 'TwoPlayer')"><option value="TwoPlayer">Two players</option><option value="Computer">vs computer</option></select></div></header>
<section class="content"><ng-container *ngIf="game.state$ | async as state; else loading"><div class="play"><div class="status"><div><span class="status-label">CURRENT ROUND</span><strong>{{ message(state) }}</strong></div></div><app-game-board [state]="state" (cellSelected)="game.move($event[0], $event[1])"></app-game-board><div class="actions"><button class="primary" type="button" (click)="game.reset()"><span aria-hidden="true">↻</span> Reset game</button><button type="button" [disabled]="!state.canUndo" (click)="game.undo()"><span aria-hidden="true">↶</span> Undo last move</button></div></div><aside><app-scoreboard [score]="state.scoreboard" (reset)="game.resetScoreboard()"></app-scoreboard><div class="panel"><div class="panel-heading"><h2>Move history</h2><span>{{ state.moveHistory.length }} moves</span></div><app-move-history [moves]="state.moveHistory"></app-move-history><p *ngIf="!state.moveHistory.length" class="muted">Your first move is waiting.</p></div></aside></ng-container><ng-template #loading><p class="loading">Creating your board...</p></ng-template></section><p *ngIf="game.error$ | async as error" class="error">{{ error }}</p></main>
